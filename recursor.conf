################################################################################
# /etc/pdns-recursor/recursor.conf
# PowerDNS Recursor 4.8.9
#
# Platform:    Oracle Linux 8 (systemd 239, SELinux enforcing)
# Maintainer:  <your-org-security-team>
#
# Design
#   1. Full iterative resolver — walks the DNS tree from root servers.
#      No forwarders. Begins every unknown resolution at the root.
#   2. Operator-controlled root hints; supports anycast root servers and
#      static fallback when dynamic updates are unavailable.
#   3. DNSSEC full validation with explicit trust anchors (addTA() in
#      recursor.lua). Bogus responses return SERVFAIL. Both KSK-2017 and
#      KSK-2024 carried simultaneously for rollover support.
#   4. Outbound queries sourced from a single unicast address (IPv4 + IPv6).
#   5. QNAME minimisation enabled — reduces label leakage to upstream servers.
#   6. Comprehensive logging: DNSSEC failures, upstream errors, query errors,
#      protocol errors, cache events, configuration errors.
#
# Note on trust-anchor=
#   The 'trust-anchor' INI key does not exist in 4.8.x. Using it produces:
#     Fatal error: Trying to set unknown setting 'trust-anchor'
#   Trust anchors must be set via addTA() in recursor.lua.
#
# All directives verified against the 4.8.x settings reference.
# Unknown settings cause a fatal startup error — none are present here.
################################################################################


# ==============================================================================
# PROCESS / RUNTIME
# ==============================================================================

# Drop privileges after binding to port 53.
# The service account must exist before starting the daemon:
#   useradd -r -s /sbin/nologin -d /var/empty pdns-recursor
setuid=pdns-recursor
setgid=pdns-recursor

# socket-dir deliberately omitted — the stock systemd unit already passes
# --socket-dir=%t/pdns-recursor on ExecStart, resolving to /run/pdns-recursor.
# Setting it here would conflict with that argument.

# Worker threads — set to the number of logical CPU cores on this host.
threads=4


# ==============================================================================
# LISTENER / ACCESS CONTROL
# ==============================================================================

# Bind only to the interface(s) that serve clients.
# REPLACE with actual service address(es). Never use 0.0.0.0 in production.
local-address=127.0.0.1, ::1
local-port=53

# Restrict recursion to authorised client prefixes.
# REPLACE with the actual subnets that use this resolver.
allow-from=127.0.0.0/8, ::1/128

# Disable the built-in HTTP management server.
# Enable only on a dedicated, firewalled management interface if required.
webserver=no


# ==============================================================================
# OUTBOUND SOURCE ADDRESS
# ==============================================================================

# All outbound queries (to root, TLD, and authoritative servers) originate
# from these addresses — one per address family — enabling firewall policy
# enforcement and audit traceability.
# REPLACE with the actual routable outbound addresses of this host.
# Supports querying authoritative servers using both IPv4 and IPv6.
query-local-address=192.0.2.100, 2001:db8::100


# ==============================================================================
# ROOT HINTS — iterative resolution anchor
# ==============================================================================

# Operator-managed root server list. Resolver begins iterative resolution here.
# Supports anycast root servers and static fallback for isolated/degraded nets.
# See README for download and PGP-verification procedure.
hint-file=/etc/pdns-recursor/named.root


# ==============================================================================
# DNSSEC VALIDATION
# ==============================================================================

# Full validation — any response failing DNSSEC returns SERVFAIL to the client.
# Supports: RRSIG, DNSKEY, DS, NSEC/NSEC3, authenticated denial of existence,
# signature expiration handling, DS/DNSKEY chain validation, key rollover.
dnssec=validate

# Trust anchors are configured via addTA() in recursor.lua.
lua-config-file=/etc/pdns-recursor/recursor.lua

# Log every DNSSEC validation failure (bogus signatures, expired signatures,
# DS/DNSKEY mismatches, chain-of-trust failures).
dnssec-log-bogus=yes


# ==============================================================================
# CACHE
# ==============================================================================

# Cap maximum positive record TTL.
max-cache-ttl=86400

# Cap negative cache TTL (NXDOMAIN / NODATA) per SOA MINIMUM rules.
max-negative-ttl=3600

# Cache entry limits — tune to available RAM (values are entry counts).
max-cache-entries=1000000
max-packetcache-entries=500000

# Aggressive NSEC/NSEC3 synthesis (RFC 8198).
# Reduces upstream query volume and narrows the cache-poisoning window.
# Supports NSEC and NSEC3 proofs; requires dnssec=validate or process.
aggressive-nsec-cache-size=100000


# ==============================================================================
# TRANSPORT
# ==============================================================================

# EDNS0 outgoing buffer size.
# 1232 = DNS Flag Day 2020 recommendation; fits within the minimum IPv6 MTU
# (1280 bytes per RFC 8200) after subtracting IPv6 and UDP headers.
# Supports fragmentation-safe behavior for large DNSSEC responses.
edns-outgoing-bufsize=1232

# Refer ANY/UDP queries to TCP — supports TCP fallback per RFC 7766.
any-to-tcp=yes

# QNAME minimisation — reduces label leakage to upstream authoritative servers.
# Default is yes in 4.8.x; stated explicitly to preserve intent on upgrade.
qname-minimization=yes

# Cap recursion depth — limits resource exhaustion from crafted delegations.
# Default is 16. Set to 20 to accommodate deeper enterprise delegation chains
# while staying conservative. Reduce to 16 for flat internal-only zones.
max-recursion-depth=20

# Cap outbound queries per single resolution.
max-qperq=50

# Cap incoming UDP queries processed per event-loop iteration.
max-udp-queries-per-round=10000

# Timeout (milliseconds) waiting for a response from an authoritative server.
# Default 1500 ms. Raised to support degraded networks and intermittent
# connectivity without triggering premature SERVFAIL.
network-timeout=2000


# ==============================================================================
# UPSTREAM SERVER FAILURE HANDLING
# ==============================================================================

# Number of consecutive failures before marking an authoritative server as down.
# Supports logging and fallback to other servers when one becomes unreachable.
server-down-max-fails=5

# Seconds to throttle a server marked as down before retrying.
server-down-throttle-time=60


# ==============================================================================
# IDENTITY
# ==============================================================================

# Suppress version and identity disclosure.
# version-string hides the build version; server-id=disabled prevents
# hostname disclosure via CHAOS class queries (id.server, hostname.bind).
version-string=PowerDNS
server-id=disabled


# ==============================================================================
# LOGGING
# ==============================================================================

# Syslog facility local3 — separates DNS logs from system logs, simplifying
# SIEM filter rules and log-rotation policy.
logging-facility=3

# Level 6 (info) captures: start/stop, config load, query/response events,
# DNSSEC validation failures, bogus responses, SERVFAIL events,
# upstream server errors, root server failures, protocol errors.
loglevel=6

# Disable quiet mode — ensures query-level log entries are generated.
quiet=no

# Log common DNS errors: REFUSED, FORMERR, upstream timeouts, malformed
# responses, unreachable servers, protocol errors.
log-common-errors=yes

# Log RPZ zone additions and removals.
# Remove this directive if no RPZ zones are configured.
log-rpz-changes=yes

# Explicit: do not pass EDNS Client Subnet to upstream servers.
# Default is no in 4.8.x; stated here to preserve intent on upgrade.
use-incoming-edns-subnet=no


# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
