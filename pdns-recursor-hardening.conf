# ==============================================================================
# /etc/systemd/system/pdns-recursor.service.d/hardening.conf
# Hardening drop-in for PowerDNS Recursor 4.8.9 on Oracle Linux 8
#
# systemd version: 239 (shipped across all OL8 point releases)
#
# Stock unit already sets — do NOT repeat; list-type keys accumulate
# ------------------------------------------------------------------
#   User/Group=pdns-recursor
#   RuntimeDirectory=pdns-recursor   → creates /run/pdns-recursor
#   LimitNOFILE=16384
#   CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_CHOWN
#   AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_CHOWN
#   SystemCallFilter=~ @clock @debug @module @mount @raw-io @reboot
#                      @swap @cpu-emulation @obsolete
#   SystemCallArchitectures=native
#   RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
#   RestrictNamespaces=true    RestrictRealtime=true
#   ProtectSystem=full         ProtectHome=true
#   ProtectControlGroups=true  ProtectKernelModules=true
#   ProtectKernelTunables=true
#   PrivateTmp=true            PrivateDevices=true
#   LockPersonality=true       NoNewPrivileges=true
#
# Omitted — not present in systemd 239 or breaks OL8
# ---------------------------------------------------
#   ProtectSystem=strict      → breaks exec under SELinux enforcing on OL8
#   ProtectHostname=          → added in systemd 240
#   ProtectClock=             → added in systemd 245
#   ProtectKernelLogs=        → added in systemd 253
#   RestrictSUIDSGID=         → added in systemd 245
#   MemoryDenyWriteExecute=   → breaks OL8 glibc JIT (EL8 known issue)
#   ReadOnlyPaths=            → NAMESPACE error if path absent at start time
#   ReadWritePaths=           → RuntimeDirectory= in stock unit covers /run/pdns-recursor
# ==============================================================================

[Service]

# ── Tighten capabilities ──────────────────────────────────────────────────────
# Empty assignment clears the inherited list; the second line sets the new
# value. Drops CAP_CHOWN — not needed once running as the daemon user.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE

# ── Prevent core dumps ────────────────────────────────────────────────────────
LimitCORE=0

# ── Tighten syscall filter ────────────────────────────────────────────────────
# Clear inherited value first, then restate with two additional groups blocked.
SystemCallFilter=
SystemCallFilter=~ @clock @debug @module @mount @raw-io @reboot @swap @cpu-emulation @obsolete @privileged @resources
SystemCallErrorNumber=EPERM

# ── File creation mask ────────────────────────────────────────────────────────
UMask=0027

# ── IPC cleanup on exit ───────────────────────────────────────────────────────
RemoveIPC=yes

# ── Syslog facility ───────────────────────────────────────────────────────────
SyslogFacility=local3

# ── Pre-start config existence check ─────────────────────────────────────────
# Emits a clear error message before any namespace setup is attempted, instead
# of the cryptic "Failed at step EXEC" that results from a missing config.
ExecStartPre=/bin/sh -c 'test -f /etc/pdns-recursor/recursor.conf || { echo "FATAL: /etc/pdns-recursor/recursor.conf missing"; exit 1; }'
ExecStartPre=/bin/sh -c 'test -f /etc/pdns-recursor/recursor.lua  || { echo "FATAL: /etc/pdns-recursor/recursor.lua missing"; exit 1; }'
